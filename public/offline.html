<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0c0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Нет интернета — pnk Почта</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #0c0d10;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
      }
      .card {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 18px;
        overflow: hidden;
        background: #17191f;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.03em;
        font-weight: 700;
      }
      p {
        margin: 12px 0 0;
        font-size: 15px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.45);
      }
      button {
        margin-top: 32px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 14px;
        background: #0066ff;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:active {
        background: #0052cc;
      }
      button:disabled {
        opacity: 0.65;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="icon" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="72"
            height="72"
            viewBox="0 0 72 72"
            fill="none"
          >
            <rect width="72" height="72" rx="18" fill="#17191f" />
            <path
              d="M18 28c10.5-9 25.5-9 36 0"
              stroke="#3b82f6"
              stroke-width="3.2"
              stroke-linecap="round"
              opacity=".35"
            />
            <path
              d="M23.5 34.5c7.3-6.2 17.7-6.2 25 0"
              stroke="#3b82f6"
              stroke-width="3.2"
              stroke-linecap="round"
              opacity=".55"
            />
            <path
              d="M29 41c4.1-3.4 9.9-3.4 14 0"
              stroke="#3b82f6"
              stroke-width="3.2"
              stroke-linecap="round"
            />
            <circle cx="36" cy="48.5" r="3.2" fill="#3b82f6" />
            <path
              d="M22 22l28 28"
              stroke="#ef4444"
              stroke-width="3.4"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <h1>Нет интернета</h1>
        <p>
          Проверьте подключение или выключите VPN и обновите страницу. Также
          возможно, в вашем регионе действуют ограничения мобильной связи.
        </p>
        <button type="button" id="retry">Обновить страницу</button>
      </div>
    </div>
    <script>
      (function () {
        var btn = document.getElementById("retry");
        var busy = false;
        function goHome() {
          var url = "/mail?_r=" + Date.now();
          try {
            window.location.replace(url);
          } catch (e) {
            window.location.href = url;
          }
        }
        async function retry() {
          if (busy) return;
          busy = true;
          btn.disabled = true;
          btn.textContent = "Проверяем…";
          if (!navigator.onLine) {
            btn.textContent = "Сети всё ещё нет";
            window.setTimeout(function () {
              btn.textContent = "Обновить страницу";
              btn.disabled = false;
              busy = false;
            }, 1200);
            return;
          }
          try {
            await fetch("/favicon-32.png?_=" + Date.now(), {
              cache: "no-store",
              mode: "no-cors",
            });
          } catch (e) {
            /* still try navigate — SW may recover */
          }
          goHome();
        }
        btn.addEventListener("click", function () {
          void retry();
        });
        window.addEventListener("online", function () {
          goHome();
        });
      })();
    </script>
  </body>
</html>
