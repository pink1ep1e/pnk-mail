<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0c0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Нет интернета — pnk почта</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #0c0d10;
        color: #fff;
        /* System stack only — no webfonts (page may be offline) */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
      }
      .card {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 18px;
        overflow: hidden;
      }
      .icon img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.03em;
        font-weight: 700;
      }
      p {
        margin: 12px 0 0;
        font-size: 15px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.45);
      }
      button {
        margin-top: 32px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 14px;
        background: #0066ff;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:active {
        background: #0052cc;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="icon" aria-hidden="true">
          <img src="/icon-192.png" alt="" width="72" height="72" />
        </div>
        <h1>Нет интернета</h1>
        <p>
          Проверьте подключение или выключите VPN и обновите страницу.
        </p>
        <button type="button" onclick="location.reload()">
          Обновить страницу
        </button>
      </div>
    </div>
  </body>
</html>
